<script type="text/javascript">

Homey.setTitle( __('pair.title') );

$(function() {
	$('#connect').click(function() {
    $('.deye-error').hide();

    var inputaddress = $('#address').val();
    var inputport = Number($('#port').val());
    var invertorid = Number($('#invertorid').val());

    var deviceId = Math.random().toString(36).substr(2,5).toLowerCase();
    var id = Math.round(Math.random() * (100000 - 10000) + 10000);

    if (inputaddress != '' && inputport > 0 && inputport < 65536 && Number.isInteger(invertorid) && invertorid >= 0) {
      var device_data = {
        id:  deviceId
      };

      var settings = {
        address : inputaddress,
        port    : inputport,
        id      : invertorid
      };

      Homey.addDevice({
        name   : 'Deye Inverter_' + deviceId,
        data 	 : device_data,
        settings : settings
      }, function(error, result) {
        if (error) {
            $('.deye-error').show();
            $('.deye-error-msg').html(error.message || error.toString() );
            return;
        }
        $('.deye-error').hide();

        Homey.done();
      })

    } else {
        $('.deye-error').show();
        $('.deye-error-msg').html( __('pair.nosettings') );
    }

	});
})
</script>
